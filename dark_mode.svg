<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390">
  <style>
    @font-face {
      font-family: 'ConsolasFallback';
      src: local('Consolas'), local('Courier New');
      size-adjust: 109%;
